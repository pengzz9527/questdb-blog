params:
  author: "Ross Zhang"
  images:
    - social-card.png
  favicon: "/images/favicon.ico"
  cookies:
    enabled: false
  ImageProcessing:
    cover:
      enabled: true
    content:
      enabled: true
    thumbnail:
      enabled: true

  umami:
    serverURL: "https://umami.questdblab.org"
    websiteID: "ff3cdf0a-cfc8-4e14-bf8f-ebc64338be4a"

  sidebar:
    avatar: "/images/avatar.png"
    compact: false
    status: "https://status.questdblab.org"
  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 10
      - type: categories
        params:
          limit: 10
    page:
      - type: toc

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
  page:
    - HTML
    - JSON

